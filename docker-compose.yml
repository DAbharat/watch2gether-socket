services:
  backend:
    build: ./watch2gether-sockets
    ports:
      -"5000:5000"
    environment:
      - PORT=3001
      - REDIS_URL: redis://redis:6379
    depends_on:
      - redis:
          condition: service_healthy

redis:
  image: redis:7-alpine
  ports:
    - "6379:6379"
  volumes:
  - redis_data:/data
  command: redis-server --appendonly yes
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 5

volumes:
  redis_data: